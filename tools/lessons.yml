# The book's parts and lessons, in reading order. tools/build_nav.py reads this.
#
# Each part: folder, code (a short ticker-style label), group (the site tab),
# title, summary, before. Each lesson: [slug, "Title", [kind]] or [slug, "Title", [kind, review]].
# Kinds: idea, skill, strategy, data, canada, code, case, career. Quote every title.
# Lesson files are docs/<folder>/NN-<slug>.md, numbered by position (01, 02, ...).

groups:
  - Foundations
  - Trading
  - Companies and economy
  - Investing and derivatives
  - Markets, data and quant
  - History and careers

