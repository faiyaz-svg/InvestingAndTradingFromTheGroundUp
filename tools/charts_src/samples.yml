# Example charts used by docs/style-sample.md and the chart tests. Lessons use
# their own file, tools/charts_src/<folder>.yml.
- name: daily-trend-pullback
  seed: 7
  csv: stock-a-daily
  tf: D
  start: 2026-01-05
  price: 100
  volume: 2000000
  segments:
