- id: vol-fomc-size
  chart: |
    data: 16-volatility-and-event-trading/index-x-fomc-5m.json
    show: volume
    range: 2026-10-28 09:30 to 2026-10-28 15:55
  q: "The morning 5-minute bars average 3.06 points tall and the 2:00 p.m. bar is 25.02 points. How many times larger is it (one decimal)?"
  type: number
