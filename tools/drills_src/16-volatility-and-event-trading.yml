  tolerance: 0.1
  explain: "25.02 / 3.06 = 8.2."

- id: vol-index-add-gap
  chart: |
    data: 16-volatility-and-event-trading/stock-b-index-add.json
    range: 2026-06-15 to 2026-08-11
  q: "Stock B closed at 33.03 on July 3 and opened at 35.18 on July 6 on an index addition. What is the gap in percent (one decimal)?"
