site_name: Investing and Trading From the Ground Up
site_description: A self-study book on investing and trading US markets from Canada. Markets, accounts and taxes, risk, charts, swing and day trading, company financials, valuation, macro, bonds, ETFs, futures, options, crypto, data and careers.
site_url: https://faiyaz-svg.github.io/InvestingAndTradingFromTheGroundUp/
repo_url: https://github.com/faiyaz-svg/InvestingAndTradingFromTheGroundUp
repo_name: faiyaz-svg/InvestingAndTradingFromTheGroundUp
edit_uri: edit/main/docs/
docs_dir: docs
copyright: "For education only. Nothing in this book is financial, tax or legal advice."

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
  # Dark (the terminal) first, so it is the default when the reader has no preference.
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

plugins:
  - search

# Listing any extension replaces Zensical's defaults, so every extension used is listed here.
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  # Math only between \( \) and \[ \], so a plain $ is always a dollar sign.
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: [round]
      block_syntax: [square, begin]
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: chart
          class: chart
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0.16.47/dist/katex.min.js
  - https://unpkg.com/katex@0.16.47/dist/contrib/auto-render.min.js
  - assets/vendor/lightweight-charts/lightweight-charts.standalone.production.js
  - javascripts/theme.js
  - javascripts/charts.js
  - javascripts/drills.js
  - javascripts/prevnext.js
  - javascripts/progress.js

extra_css:
  - https://unpkg.com/katex@0.16.47/dist/katex.min.css
  - https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap
  - stylesheets/site.css
  - stylesheets/drills.css

